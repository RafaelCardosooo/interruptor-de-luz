<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Interruptor de Luz</title>
<style>
  body{ background:#111; color:white; font-family:sans-serif; text-align:center; padding-top:20px; transition:0.5s; }
  #lampada{ font-size:100px; transition:0.4s; }
  #lampada.acesa{ text-shadow: 0 0 25px #ffeb3b, 0 0 50px #ffeb3b; transform: scale(1.15); }
  #lampada.apagada{ opacity:0.3; }
  .card{ background:#222; color:white; padding:25px; border-radius:15px; width:300px; margin:20px auto; }
  #barra{ width:100%; height:20px; background:#444; border-radius:10px; overflow:hidden; margin-top:10px;}
  #nivel{ height:100%; background:lime; width:5%; }
  button{ padding:10px 18px; margin-top:15px; border-radius:8px; border:none; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>
  <h1>Interruptor de Luz</h1>
  <div id="lampada">💡</div>
  <div class="card">
    <p id="status-dia"></p>
    <p id="status-luz"></p>
    <p id="status-final"></p>
    <div id="barra"><div id="nivel"></div></div>
    <p style="font-size:13px; margin-top:8px;">Bateria: 5%</p>
    <button onclick="trocarDiaNoite()">Trocar Dia / Noite</button>
  </div>
<script src="script.js"></script>
</body>
</html>
