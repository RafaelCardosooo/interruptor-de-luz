<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Interruptor de Luz</title>
<style>
  body{ background:#111; color:white; font-family:sans-serif; text-align:center; padding-top:40px; }
  .card{ background:#222; padding:25px; border-radius:15px; width:320px; margin:20px auto; }
  p{ font-size:18px; margin:10px 0; }
  #barra{ width:100%; height:22px; background:#333; border-radius:10px; margin-top:15px; overflow:hidden; }
  #nivel{ height:100%; background:lime; width:5%; }
</style>
</head>
<body>
  <h1>Interruptor de Luz</h1>
  
  <div class="card">
    <p id="status-dia">Carregando...</p>
    <p id="status-luz">Carregando...</p>
    <p id="status-final">Carregando...</p>
    <div id="barra"><div id="nivel"></div></div>
    <p style="font-size:14px; margin-top:10px;">Bateria: 5%</p>
    <button onclick="alternarLuz()" style="margin-top:15px; padding:10px 20px; cursor:pointer;">Ligar / Desligar</button>
  </div>

<script src="script.js"></script>
</body>
</html>
