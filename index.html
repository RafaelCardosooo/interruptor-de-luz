<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Interruptor de Luz</title>
<style>
  body{ 
    background:#111; color:white; font-family:sans-serif; text-align:center; 
    padding-top:30px; transition: background 0.5s;
  }
  #lampada{
    font-size:90px;
    margin:10px auto;
    filter: grayscale(100%) brightness(0.5);
    transition: all 0.4s;
    text-shadow: 0 0 0px transparent;
  }
  #lampada.acesa{
    filter: grayscale(0%) brightness(1.3);
    text-shadow: 0 0 30px #ffeb3b, 0 0 60px #ffeb3b;
    transform: scale(1.1);
  }
  .card{ 
    background:#222; padding:25px; border-radius:15px; width:320px; 
    margin:20px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  p{ font-size:18px; margin:10px 0; }
  #barra{ width:100%; height:22px; background:#333; border-radius:10px; margin-top:15px; overflow:hidden; }
  #nivel{ height:100%; background:lime; width:5%; transition: width 0.5s;}
  button{ margin-top:15px; padding:10px 20px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
</style>
</head>
<body>
  <h1>Interruptor de Luz</h1>
  
  <div id="lampada">💡</div>

  <div class="card">
    <p id="status-dia">Carregando...</p>
    <p id="status-luz">Carregando...</p>
    <p id="status-final">Carregando...</p>
    <div id="barra"><div id="nivel"></div></div>
    <p style="font-size:14px; margin-top:10px;">Bateria: 5%</p>
    <button onclick="trocarDiaNoite()">Trocar Dia / Noite</button>
  </div>

<script src="script.js"></script>
</body>
</html>
